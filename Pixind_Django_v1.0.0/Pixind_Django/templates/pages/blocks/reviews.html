<!-- Start -->
<section class="relative overflow-hidden bg-slate-50 dark:bg-slate-800 md:py-24 py-16" id="reviews">
    <div class="container relative">
        <div class="grid lg:grid-cols-12 grid-cols-1 items-center gap-6">
            <div class="lg:col-span-6 lg:text-start text-center lg:pb-0 pb-6">
                <h6 class="text-primary uppercase text-sm font-bold tracking-wider mb-3 wow animate__animated animate__fadeInUp" data-wow-delay=".2s">{{ sections.reviews.eyebrow }}</h6>
                <h4 class="mb-4 text-[32px] md:leading-normal leading-normal font-bold wow animate__animated animate__fadeInUp" data-wow-delay=".4s">{{ sections.reviews.title_html|safe }}</h4>
                <p class="text-slate-400 max-w-xl lg:ms-auto mx-auto wow animate__animated animate__fadeInUp" data-wow-delay=".6s">{{ sections.reviews.description }}</p>
            </div>

            <div class="lg:col-span-6 lg:ms-6 lg:mt-0 mt-6">
                <div class="tiny-single-item wow animate__animated animate__fadeInUp" data-wow-delay=".2s">
                        
                    <!-- Components/Home/reviews.html -->
                    {% include 'Components/Home/reviews.html' %}

                </div>
            </div>
        </div><!--end grid-->

        <div class="grid lg:grid-cols-12 grid-cols-1 md:text-start mt-10 justify-center">
            <div class="lg:col-start-2 lg:col-span-10">
                <div class="grid md:grid-cols-4 sm:grid-cols-2 grid-cols-1 items-center gap-6 ">
                        
                    <!-- Components/Home/counter.html -->
                    {% include 'Components/Home/counter.html' %}
                
                </div>
            </div>
        </div><!--end grid-->
    </div><!--end container-->
</section><!--end section-->
<!-- End -->

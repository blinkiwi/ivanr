<!-- Start -->
<section class="relative overflow-hidden bg-slate-50 dark:bg-slate-800 md:py-24 py-16" id="features" style="padding-bottom:0">
    <div class="container relative">
        <div class="grid grid-cols-1 pb-6 text-center">
            <h6 class="text-primary uppercase text-sm font-bold tracking-wider mb-3 wow animate__animated animate__fadeInUp" data-wow-delay=".2s">{{ sections.features.eyebrow }}</h6>
            <h4 class="mb-4 text-[32px] md:leading-normal leading-normal font-bold wow animate__animated animate__fadeInUp" data-wow-delay=".4s">{{ sections.features.title_html|safe }}</h4>

            <p class="text-slate-400 max-w-xl mx-auto wow animate__animated animate__fadeInUp" data-wow-delay=".6s">{{ sections.features.description }}</p>
        </div><!--end grid-->

        <div class="grid lg:grid-cols-4 md:grid-cols-2 grid-cols-1 mt-6 gap-6 items-center">
                
            <!-- Components/Home/features.html -->
            {% include 'Components/Home/features.html' %}

        </div><!--end grid-->
    </div><!--end container-->
</section><!--end section-->

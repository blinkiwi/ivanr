<div class="md:col-span-5 lg:me-6">
    <div>
        <h6 class="text-primary uppercase text-sm font-bold tracking-wider mb-3 wow animate__animated animate__fadeInUp" data-wow-delay=".2s">{{ sections.choose_us.eyebrow }}</h6>
        <h4 class="mb-4 text-[32px] md:leading-normal leading-normal font-bold wow animate__animated animate__fadeInUp" data-wow-delay=".4s">{{ sections.choose_us.title_html|safe }}</h4>
        <p class="text-slate-400 max-w-xl wow animate__animated animate__fadeInUp" data-wow-delay=".6s">{{ sections.choose_us.description }}</p>
    </div>
    
    <div class="sticky top-20 mt-6 wow animate__animated animate__fadeInUp" data-wow-delay=".8s">
        <ul class="flex-column" id="myTab" data-tabs-toggle="#myTabContent" role="tablist">
            {% for tab in service_tabs %}
            <li role="presentation">
                <button class="px-5 py-3 text-lg font-semibold rounded-lg w-full hover:text-primary duration-500 flex items-center justify-between{% if not forloop.first %} mt-3{% endif %}" id="tab-{{ forloop.counter0 }}" data-tabs-target="#panel-{{ forloop.counter0 }}" type="button" role="tab" aria-controls="panel-{{ forloop.counter0 }}" aria-selected="{% if forloop.first %}true{% else %}false{% endif %}">{{ tab.label }}</button>
            </li>
            {% endfor %}
        </ul>
    </div>
</div>

<div class="md:col-span-7">
    <div id="myTabContent" class="shadow-sm shadow-gray-200 dark:shadow-gray-800 rounded-lg wow animate__animated animate__fadeInUp" data-wow-delay=".5s">
        {% for tab in service_tabs %}
        <div class="group relative overflow-hidden rounded-lg{% if not forloop.first %} hidden{% endif %}" id="panel-{{ forloop.counter0 }}" role="tabpanel" aria-labelledby="tab-{{ forloop.counter0 }}">
            <img src="{{ tab.image }}" class="shadow-sm group-hover:scale-105 duration-500" alt="{{ tab.title }}">
            <div class="p-6 m-6 absolute bottom-0 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md rounded-lg duration-500">
                <a href="{{ tab.url }}" class="text-xl font-semibold hover:text-primary">{{ tab.title }}</a>
                <p class="text-slate-400 mt-2">{{ tab.text }}</p>

                <div class="mt-3">
                    <a href="{{ tab.url }}" class="hover:text-primary inline-flex items-center">Read More <i class="ri-arrow-right-up-line text-base ms-1 group-hover:rotate-45 duration-500"></i></a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

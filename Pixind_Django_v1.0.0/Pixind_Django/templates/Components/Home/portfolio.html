{% for item in portfolios|slice:"0:6" %}
    <div class="picture-item" data-groups='{{ item.groups }}'>
        <div class="group relative block overflow-hidden rounded-lg duration-500 wow animate__animated animate__fadeInUp" data-wow-delay="{{ item.data }}">
            <img src="{{ item.img }}" class="group-hover:origin-center group-hover:scale-125 duration-500" alt="">
            <div class="absolute inset-4 group-hover:bg-white/50 dark:group-hover:bg-slate-900/50 group-hover:backdrop-blur-xs duration-500 z-0 rounded-lg"></div>

            <div class="content duration-500">
                <div class="icon absolute z-10 opacity-0 group-hover:opacity-100 top-8 inset-e-8 duration-500">
                    <a href="{{ item.img }}" class="size-9 inline-flex items-center justify-center tracking-wide align-middle duration-500 text-center bg-primary text-white rounded-md lightbox"><i class="ri-camera-line text-base"></i></a>
                </div>

                <div class="absolute z-10 opacity-0 group-hover:opacity-100 bottom-8 inset-s-8 duration-500">
                    <a href="{% url 'App:single_portfolio' title=item.title|slugify %}" class="text-lg font-medium hover:text-primary duration-500 ease-in-out">{{ item.title }}</a>
                    <p class="text-slate-900/60 dark:text-white/60 mb-0">{{ item.name }}</p>
                </div>
            </div>
        </div>
    </div>
{% endfor %}

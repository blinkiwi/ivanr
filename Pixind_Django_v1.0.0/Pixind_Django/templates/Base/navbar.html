<nav id="topnav" class="defaultscroll is-sticky">
    <div class="container relative">
        <!-- Logo container-->
        <a class="logo" href="{% url 'App:index' %}">
            <span class="inline-block dark:hidden logo-default">
                <img src="{{ sticky.logo }}" class="l-dark" alt="{{ site_name }}">
                <img src="{{ sticky.logo }}" class="l-light" alt="{{ site_name }}">
            </span>
            <img src="{{ sticky.logo }}" class="hidden dark:inline-block logo-default" alt="{{ site_name }}">
            {% if sticky.logo_scroll %}
            <img src="{{ sticky.logo_scroll }}" class="logo-scroll" alt="{{ site_name }}">
            {% endif %}
        </a>

        <!-- End Logo container-->
        <div class="menu-extras">
            <div class="menu-item">
                <!-- Mobile menu toggle-->
                <a class="navbar-toggle" id="isToggle" onclick="toggleMenu()">
                    <div class="lines">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </a>
                <!-- End mobile menu toggle-->
            </div>
        </div>

        <!--Login button Start-->
        <ul class="buy-button list-none">
            <li class="inline">
                <a href="{{ sticky.cta_url }}" class="group h-10 px-4 text-menu tracking-wider inline-flex items-center justify-center font-medium rounded-md bg-primary/10 hover:bg-primary text-primary hover:text-white">{{ sticky.cta_label }} <i class="ri-arrow-right-up-line text-base ms-1 group-hover:rotate-45 duration-500"></i></a>
            </li>
        </ul>
        <!--Login button End-->

        <div id="navigation">
            <!-- Navigation Menu-->   
            <ul class="navigation-menu nav-light" id="navmenu-nav">
                {% for item in nav_items %}
                <li class="has-submenu">
                    <a class="sub-menu-item" href="{{ item.url }}">{{ item.label }}</a>
                </li>
                {% endfor %}
            </ul><!--end navigation menu-->
        </div><!--end navigation-->
    </div><!--end container-->
</nav>
